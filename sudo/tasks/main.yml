---
  - name: Configure sudo
    become: yes
    lineinfile:
      path: '/etc/sudoers.d/{{ item.key }}'
      line: '{{ item.value.entity }} ALL=(ALL:ALL) {{ item.value.how }}:{{ item.value.path }}'
      validate: /usr/sbin/visudo -cf %s
      create: yes
      mode: 0640
    with_dict: '{{ sudo_config }}'
